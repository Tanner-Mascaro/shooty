<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wait">
  <div id="waitTitle">ARENA</div>
  <div id="profile">
    <input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false">
    <div id="stats"></div>
    <div id="account">
      <span id="signedOut"><button id="showAuth" class="link">Sign in / create account</button> to keep your stats on any device</span>
      <span id="signedIn" hidden>Signed in as <b id="acctName"></b> · <button id="logoutBtn" class="link">Sign out</button></span>
      <form id="authForm" hidden>
        <input id="authUser" placeholder="Username" maxlength="16" autocomplete="username" spellcheck="false">
        <input id="authPass" type="password" placeholder="Password" maxlength="72" autocomplete="current-password">
        <button type="submit">Sign in</button>
        <button type="button" id="registerBtn">Create account</button>
        <div id="authErr"></div>
      </form>
    </div>
  </div>
  <div id="levels">
    <button data-level="hell">HELL</button>
    <button data-level="robot">ROBOT FACTORY</button>
    <button data-level="witch">WITCH SWAMP</button>
  </div>
  <div id="waitMsg">Connecting...</div>
  <button id="readyBtn" disabled>I'm Here</button>
  <table id="board" hidden>
    <caption>LEADERBOARD</caption>
    <thead><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>Kills</th><th>K/D</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<div id="hud">
  <div class="ph"><span style="color:#fa4;font-weight:bold">YOU</span> <span id="sk">0</span>
    <div class="hp-bar"><div class="hp-fill" id="myhp" style="width:100%;background:#fa4"></div></div>
  </div>
  <div class="ph"><span id="ename" style="color:#f33;font-weight:bold">ENEMY</span> <span id="ek">0</span>
    <div class="hp-bar"><div class="hp-fill" id="ehp" style="width:100%;background:#f33"></div></div>
  </div>
</div>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="controls">WASD move | mouse aim | space jump (hold to bhop) | click shoot | right click scope | 1-5/Q/wheel weapon | F melee | walk over glowing pads to grab guns and health</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
