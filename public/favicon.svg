<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0c0c10"/>
  <!-- bail handle -->
  <path d="M18 22c0-10 28-10 28 0" fill="none" stroke="#5a5068" stroke-width="3.5" stroke-linecap="round"/>
  <!-- rim -->
  <ellipse cx="32" cy="24" rx="18" ry="5" fill="#2a2234"/>
  <ellipse cx="32" cy="23" rx="15" ry="3.5" fill="#7a3cff"/>
  <!-- brew highlight bubbles -->
  <circle cx="27" cy="22.5" r="1.6" fill="#c9a0ff"/>
  <circle cx="36" cy="23" r="1.1" fill="#e8d0ff"/>
  <!-- pot body -->
  <path d="M14 26c0 18 8 28 18 28s18-10 18-28" fill="#1a1422"/>
  <path d="M17 27c1 15 7 24 15 24s14-9 15-24" fill="#2c2438"/>
  <!-- rivet band -->
  <path d="M16 34h32" stroke="#4a4060" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="34" r="1.2" fill="#6a6080"/>
  <circle cx="32" cy="34" r="1.2" fill="#6a6080"/>
  <circle cx="42" cy="34" r="1.2" fill="#6a6080"/>
  <!-- feet -->
  <path d="M20 52v6M32 54v6M44 52v6" stroke="#1a1422" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 52v5M32 54v5M44 52v5" stroke="#3a3248" stroke-width="2" stroke-linecap="round"/>
  <!-- soft glow under brew -->
  <ellipse cx="32" cy="28" rx="10" ry="4" fill="#9b5cff" opacity="0.35"/>
</svg>
